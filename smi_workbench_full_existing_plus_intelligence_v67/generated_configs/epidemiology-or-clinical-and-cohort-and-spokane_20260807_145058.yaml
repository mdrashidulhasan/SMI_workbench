literature_search:
  query: (epidemiology or clinical) and cohort and Spokane
  start_date: '2015-01-01'
  end_date: '2026-08-07'
  database:
  - pubmed
  limit: 1000
deduplication:
  limit: 1000
ai_screening:
  enabled: true
  exclusion_criteria: {}
  limit: 1000
  chunk_size: 75
  min_chunk_size: 25
  retries: 1
record_retrieval:
  type: screened
  start_index: 0
  number_of_records: 1000
pdf_download:
  enabled: true
  unpaywall_email: ''
  row_level_pdfs: true
  batch_size: 1
  min_batch_size: 1
intelligence:
  enabled: true
  modules:
  - exposure_health_associations
  - clinical_epidemiology
  - research_datasets
  - geospatial_datasets
  - cohorts
  - chemical_watchlist
approval_gates:
  post-pdf-download: true
  final-approval: true
